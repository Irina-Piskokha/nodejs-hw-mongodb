tags:
  - Auth
summary: Logout from the account
operationId: logoutUser
description: 'Logs out the user from the account.'
security:
  - bearerAuth: []
responses:
  '200':
    description: 'Logged out successfully.'
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: 'Logged out successfully'
